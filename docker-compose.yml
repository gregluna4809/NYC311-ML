services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nyc311}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nyc311_password}
      POSTGRES_DB: ${POSTGRES_DB:-nyc311_ml}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  dataloader:
    build:
      context: .
      dockerfile: docker/Dockerfile.dataloader
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    entrypoint: []
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-nyc311}:${POSTGRES_PASSWORD:-nyc311_password}@postgres:5432/${POSTGRES_DB:-nyc311_ml}
    command: >
      sh -c "
        python scripts/download_sample.py &&
        python scripts/clean_dataset.py &&
        python scripts/load_to_postgres.py
      "
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-nyc311}:${POSTGRES_PASSWORD:-nyc311_password}@postgres:5432/${POSTGRES_DB:-nyc311_ml}
    depends_on:
      dataloader:
        condition: service_completed_successfully
    ports:
      - "8001:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data:

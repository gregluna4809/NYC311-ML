services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nyc311}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nyc311_password}
      POSTGRES_DB: ${POSTGRES_DB:-nyc311_ml}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nyc311} -d ${POSTGRES_DB:-nyc311_ml}"]
      interval: 5s
      timeout: 5s
      retries: 10

  dataloader:
    build:
      context: .
      dockerfile: docker/Dockerfile.dataloader
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    entrypoint: []
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-nyc311}:${POSTGRES_PASSWORD:-nyc311_password}@postgres:5432/${POSTGRES_DB:-nyc311_ml}
      NYC_OPENDATA_APP_TOKEN: ${NYC_OPENDATA_APP_TOKEN:-}
    command: >
      sh -c "
        python scripts/download_sample.py &&
        python scripts/clean_dataset.py &&
        python scripts/load_to_postgres.py
      "
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-nyc311}:${POSTGRES_PASSWORD:-nyc311_password}@postgres:5432/${POSTGRES_DB:-nyc311_ml}
    depends_on:
      dataloader:
        condition: service_completed_successfully
    expose:
      - "8000"
    networks:
      - default
      - edge

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    expose:
      - "80"
    networks:
      - default
      - edge

volumes:
  postgres_data:

networks:
  edge:
    external: true

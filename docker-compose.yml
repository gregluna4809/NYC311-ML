services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nyc311}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nyc311_password}
      POSTGRES_DB: ${POSTGRES_DB:-nyc311_ml}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-nyc311}:${POSTGRES_PASSWORD:-nyc311_password}@postgres:5432/${POSTGRES_DB:-nyc311_ml}
    depends_on:
      - postgres
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
